<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Food Scanner — for GeometricHealth</title>
<style>
  :root {
    --bg: #0D0D12;
    --surface: #1A1A22;
    --surface2: #22222C;
    --border: #2A2A38;
    --amber: #E8C34A;
    --green: #4ECDA4;
    --red: #E85A4F;
    --text: #E4E4EC;
    --muted: #9A9AB0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    height: 100%; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  header { padding: 14px 16px 10px; flex-shrink: 0; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; color: var(--amber); }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Mode selector — the signature element: a physical three-way switch */
  .mode-switch { display: flex; gap: 6px; padding: 0 16px 12px; flex-shrink: 0; }
  .mode-btn {
    flex: 1; padding: 11px 6px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600;
    text-align: center; cursor: pointer; transition: all 0.15s; line-height: 1.3;
  }
  .mode-btn .icon { display: block; font-size: 18px; margin-bottom: 3px; }
  .mode-btn.active { background: rgba(232,195,74,0.12); border-color: var(--amber); color: var(--amber); }

  main { flex: 1; display: flex; flex-direction: column; padding: 0 16px 16px; overflow-y: auto; }

  .stage { flex-shrink: 0; position: relative; width: 100%; aspect-ratio: 3/4; max-height: 52vh;
    background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
  .stage video, .stage img.captured { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; text-align: center; padding: 20px; flex-direction: column; gap: 10px; }
  .scan-frame { position: absolute; inset: 14%; border: 2px solid rgba(232,195,74,0.55); border-radius: 12px;
    pointer-events: none; box-shadow: 0 0 0 999px rgba(0,0,0,0.35); }
  .scan-frame.plate { border-radius: 50%; inset: 8% 14%; }
  .scan-line { position: absolute; left: 14%; right: 14%; height: 2px; background: var(--amber);
    box-shadow: 0 0 8px var(--amber); animation: sweep 2s ease-in-out infinite; opacity: 0.85; }
  @keyframes sweep { 0%,100% { top: 15%; } 50% { top: 82%; } }
  @media (prefers-reduced-motion: reduce) { .scan-line { animation: none; top: 50%; } }

  .stage-status { position: absolute; bottom: 10px; left: 10px; right: 10px; text-align: center;
    font-size: 12px; color: var(--text); background: rgba(0,0,0,0.55); border-radius: 8px; padding: 7px 10px;
    backdrop-filter: blur(4px); }

  .controls { display: flex; gap: 10px; padding: 14px 0; flex-shrink: 0; }
  .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: filter 0.15s; }
  .btn:active { filter: brightness(0.88); }
  .btn-primary { background: var(--amber); color: #14140F; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .queue-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    background: var(--surface); border-radius: 10px; margin-bottom: 12px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .queue-bar strong { color: var(--text); }
  .queue-bar button { background: none; border: none; color: var(--amber); font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px; }

  /* Review card */
  .review { background: var(--surface); border-radius: 14px; padding: 16px; margin-top: 4px; }
  .review h3 { margin: 0 0 4px; font-size: 16px; }
  .conf-row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .conf-pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 20px; }
  .conf-high { background: rgba(78,205,164,0.15); color: var(--green); }
  .conf-medium { background: rgba(232,195,74,0.15); color: var(--amber); }
  .conf-low { background: rgba(232,90,79,0.15); color: var(--red); }
  .field { margin: 12px 0; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 11px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 44px; }
  .nutrient-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .nutrient-grid .field { margin: 0; }
  .blank-note { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .cert-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cert-pill { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .cert-pill.known { color: var(--green); border-color: rgba(78,205,164,0.3); }

  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
  .empty-state .big { font-size: 32px; margin-bottom: 10px; display: block; }

  footer { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); flex-shrink: 0; }
  .footer-note { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.5; }

  .toast { position: fixed; bottom: 90px; left: 16px; right: 16px; background: var(--surface2);
    border: 1px solid var(--amber); border-radius: 10px; padding: 12px 14px; font-size: 13px;
    text-align: center; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">◇ Food Scanner</div>
  <div class="brand-sub">for GeometricHealth · numbers now, verdict from your live markers</div>
</header>

<div class="mode-switch">
  <button class="mode-btn active" data-mode="barcode" onclick="setMode('barcode')">
    <span class="icon">▮▯▮</span>Barcode
  </button>
  <button class="mode-btn" data-mode="package" onclick="setMode('package')">
    <span class="icon">▭</span>Label
  </button>
  <button class="mode-btn" data-mode="plate" onclick="setMode('plate')">
    <span class="icon">◯</span>Plate
  </button>
</div>

<main>
  <div class="queue-bar" id="queue-bar" style="display:none;">
    <span><strong id="queue-count">0</strong> scanned, waiting to export</span>
    <button onclick="goToQueue()">View & export →</button>
  </div>

  <div class="stage" id="stage">
    <div class="placeholder" id="stage-placeholder">
      <div id="mode-hint">Point the camera at a barcode</div>
    </div>
    <video id="video" autoplay playsinline muted style="display:none;"></video>
    <img id="captured-img" class="captured" style="display:none;">
    <div class="scan-frame" id="scan-frame" style="display:none;"></div>
    <div class="scan-line" id="scan-line" style="display:none;"></div>
    <div class="stage-status" id="stage-status" style="display:none;"></div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="btn-retake" onclick="retake()" style="display:none;">Retake</button>
    <button class="btn btn-primary" id="btn-start" onclick="startCamera()">Start camera</button>
    <button class="btn btn-primary" id="btn-capture" onclick="capturePhoto()" style="display:none;">Capture</button>
    <button class="btn btn-secondary" id="btn-upload" onclick="document.getElementById('file-input').click()">Upload photo</button>
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFileUpload(event)">
  </div>

  <div id="review-container"></div>
</main>

<footer>
  <div class="footer-note">Scans stay on this device until you export. Verdicts need your live GeometricHealth markers — not shown here.</div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.20.0/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
// ========================= State =========================
let currentMode = 'barcode';
let stream = null;
let zxingReader = null;
let scanning = false;
let capturedDataUrl = null;
let queue = JSON.parse(localStorage.getItem('foodScannerQueue') || '[]');

const MODE_HINTS = {
  barcode: 'Point the camera at a barcode',
  package: 'Photograph the nutrition label — hold steady, fill the frame',
  plate: 'Photograph the meal or item — try to capture the whole plate'
};
const MODE_FRAME_CLASS = { barcode: '', package: '', plate: 'plate' };

updateQueueBar();

// ========================= Mode switching =========================
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('mode-hint').textContent = MODE_HINTS[mode];
  const frame = document.getElementById('scan-frame');
  frame.className = 'scan-frame ' + MODE_FRAME_CLASS[mode];
  stopCamera();
  retake();
}

// ========================= Camera lifecycle =========================
async function startCamera() {
  const video = document.getElementById('video');
  document.getElementById('stage-placeholder').style.display = 'none';
  document.getElementById('captured-img').style.display = 'none';
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-retake').style.display = 'none';
  video.style.display = 'block';

  if (currentMode === 'barcode') {
    // Barcode mode: let ZXing own the camera stream via decodeFromConstraints.
    // decodeFromVideoElement (used previously) expects to control the stream's
    // lifecycle itself — handing it a <video> whose srcObject was already set
    // via a separate getUserMedia call is a known unreliable combination on
    // iOS Safari specifically, producing zero decode attempts with no visible
    // error. decodeFromConstraints avoids that by requesting the stream itself.
    document.getElementById('scan-frame').style.display = 'block';
    document.getElementById('scan-line').style.display = 'block';
    document.getElementById('btn-capture').style.display = 'none';
    startBarcodeDecoding(video);
  } else {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
      });
    } catch (e) {
      showToast('Camera access failed — check permissions, or use "Upload photo" instead.');
      retake();
      return;
    }
    video.srcObject = stream;
    document.getElementById('scan-frame').style.display = 'block';
    document.getElementById('scan-line').style.display = 'none';
    document.getElementById('btn-capture').style.display = 'block';
  }
}

function stopCamera() {
  if (zxingReader) { try { zxingReader.reset(); } catch(e) {} zxingReader = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  scanning = false;
  const video = document.getElementById('video');
  video.srcObject = null;
  video.style.display = 'none';
  document.getElementById('scan-frame').style.display = 'none';
  document.getElementById('scan-line').style.display = 'none';
  document.getElementById('stage-status').style.display = 'none';
  document.getElementById('btn-capture').style.display = 'none';
}

function retake() {
  stopCamera();
  capturedDataUrl = null;
  document.getElementById('captured-img').style.display = 'none';
  document.getElementById('stage-placeholder').style.display = 'flex';
  document.getElementById('btn-start').style.display = 'block';
  document.getElementById('btn-retake').style.display = 'none';
  document.getElementById('review-container').innerHTML = '';
}

// ========================= Barcode decoding (live) =========================
function startBarcodeDecoding(video) {
  const status = document.getElementById('stage-status');
  status.style.display = 'block';
  status.textContent = 'Starting camera…';
  scanning = true;

  const hints = new Map();
  const formats = [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  zxingReader = new ZXing.BrowserMultiFormatReader(hints);

  const constraints = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } } };

  zxingReader.decodeFromConstraints(constraints, video, (result, err) => {
    if (!scanning) return;
    status.textContent = 'Looking for a barcode…';
    if (result) {
      scanning = false;
      status.textContent = 'Found: ' + result.getText();
      navigator.vibrate && navigator.vibrate(80);
      handleBarcodeResult(result.getText());
    }
  }).catch((err) => {
    status.textContent = 'Camera/decoder unavailable — try "Upload photo" instead.';
    showToast('Barcode scanning failed to start — try Upload photo, or Retake.');
  });
}

async function handleBarcodeResult(code) {
  stopCamera();
  document.getElementById('stage-placeholder').style.display = 'flex';
  document.getElementById('mode-hint').textContent = 'Barcode: ' + code;
  document.getElementById('btn-start').style.display = 'block';
  document.getElementById('btn-start').textContent = 'Scan another';

  renderLoadingReview('Looking up ' + code + ' in Open Food Facts…');
  const product = await lookupBarcode(code);
  renderBarcodeReview(code, product);
}

// ========================= Open Food Facts lookup (real API) =========================
async function lookupBarcode(code) {
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json`);
    const data = await res.json();
    if (data.status === 1 && data.product) return data.product;
    return null;
  } catch (e) {
    return { _error: true };
  }
}

function renderBarcodeReview(code, product) {
  const container = document.getElementById('review-container');
  if (!product) {
    container.innerHTML = `
      <div class="review">
        <h3>Not found in Open Food Facts</h3>
        <p style="color:var(--muted); font-size:13px;">Barcode ${code} scanned successfully, but no matching product in the database. This product may not be catalogued yet — try the Label mode to photograph the nutrition panel instead.</p>
        <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="setMode('package')">Switch to Label mode</button>
      </div>`;
    return;
  }
  if (product._error) {
    container.innerHTML = `<div class="review"><h3>Lookup failed</h3><p style="color:var(--muted); font-size:13px;">Could not reach Open Food Facts — check your connection and try again, or use Label mode.</p></div>`;
    return;
  }

  const n = product.nutriments || {};
  const name = product.product_name || product.product_name_en || '(unnamed product)';
  const brand = product.brands || '';
  const organic = detectOrganic(product);
  const gmStatus = detectGM(product);
  const now = new Date();

  const item = {
    id: 'item_' + Date.now(),
    source: 'barcode',
    barcode: code,
    name: brand ? `${brand} — ${name}` : name,
    confidenceId: 'high',
    confidencePortion: 'high',
    portionEstimate: '100g reference',
    scannedAt: now.toISOString(),
    consumedAt: null,
    nutrients: {
      kcal: n['energy-kcal_100g'] ?? null,
      fat_g: n['fat_100g'] ?? null,
      saturates_g: n['saturated-fat_100g'] ?? null,
      carbs_g: n['carbohydrates_100g'] ?? null,
      sugar_g: n['sugars_100g'] ?? null,
      fibre_g: n['fiber_100g'] ?? null,
      protein_g: n['proteins_100g'] ?? null,
      salt_g: n['salt_100g'] ?? null
    },
    organic: organic,
    gmStatus: gmStatus,
    ingredientsText: product.ingredients_text || null,
    allergens: product.allergens_tags ? product.allergens_tags.map(a => a.replace('en:','')).join(', ') : null
  };

  container.innerHTML = buildReviewHtml(item, { showConsumedNow: true });
  bindReviewHandlers(item);
}

function detectOrganic(product) {
  const labels = (product.labels_tags || []).join(' ').toLowerCase();
  if (labels.includes('organic')) return 'Organic (labelled)';
  return null; // honest blank — not stated, not assumed "not organic"
}
function detectGM(product) {
  const labels = (product.labels_tags || []).join(' ').toLowerCase();
  if (labels.includes('gmo-free') || labels.includes('no-gmos')) return 'GM Free (labelled)';
  if (labels.includes('made-with-gmo')) return 'Contains GM ingredients (labelled)';
  return null;
}

// ========================= Photo capture (Package / Plate) =========================
function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  capturedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
  finishCapture();
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    capturedDataUrl = e.target.result;
    // try to read EXIF timestamp for "consumed at" default — best-effort, falls back to null
    extractPhotoTimestamp(file).then(ts => { window._lastPhotoTimestamp = ts; finishCapture(); });
  };
  reader.readAsDataURL(file);
}

function extractPhotoTimestamp(file) {
  return new Promise((resolve) => {
    // Best-effort EXIF DateTimeOriginal read without a heavy library: scan for the
    // ASCII pattern EXIF uses. If not found or unparseable, resolve null — honest
    // gap, the review screen will ask rather than guess.
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const view = new DataView(e.target.result);
        if (view.getUint16(0) !== 0xFFD8) return resolve(null);
        let offset = 2;
        while (offset < view.byteLength) {
          const marker = view.getUint16(offset);
          if (marker === 0xFFE1) {
            const exifStr = new TextDecoder('ascii').decode(new Uint8Array(e.target.result, offset, Math.min(2000, view.byteLength - offset)));
            const m = exifStr.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
            if (m) {
              const iso = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`;
              return resolve(iso);
            }
            return resolve(null);
          }
          offset += 2 + view.getUint16(offset + 2);
        }
        resolve(null);
      } catch (err) { resolve(null); }
    };
    reader.onerror = () => resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 65536));
  });
}

function finishCapture() {
  stopCamera();
  document.getElementById('stage-placeholder').style.display = 'none';
  const img = document.getElementById('captured-img');
  img.src = capturedDataUrl;
  img.style.display = 'block';
  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-retake').style.display = 'block';

  if (currentMode === 'package') {
    renderLoadingReview('Reading the nutrition label…');
    runOCR(capturedDataUrl);
  } else if (currentMode === 'plate') {
    renderLoadingReview('Identifying the food…');
    runVisionIdentify(capturedDataUrl);
  }
}

// ========================= Package mode: OCR =========================
async function runOCR(dataUrl) {
  try {
    // Tesseract.js needs explicit paths to its worker script, WASM core, and
    // language data — without these, it tries to guess paths relative to the
    // page's own origin and throws immediately on recognize(), which is what
    // was happening here (every scan hit the catch block below, regardless
    // of image quality). Pinning these to the same CDN version fixes it.
    const result = await Tesseract.recognize(dataUrl, 'eng', {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@v5.0.0/dist/worker.min.js',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@v5.0.0',
      langPath: 'https://tessdata.projectnaptha.com/4.0.0'
    });
    const text = result.data.text;
    const parsed = parseNutritionText(text);
    renderPackageReview(parsed, text);
  } catch (e) {
    document.getElementById('review-container').innerHTML = `
      <div class="review"><h3>OCR failed</h3>
      <p style="color:var(--muted); font-size:13px;">Could not read the label (${escapeHtml(String(e.message || e))}). Try retaking with better lighting and the label filling the frame, or enter values manually below.</p>
      </div>` + buildManualPackageForm();
    bindManualPackageHandlers();
  }
}

function normalizeOcrText(text) {
  // Corrects known Tesseract failure modes BEFORE number extraction — without this,
  // "O.15g" (letter O misread for zero) silently parses as 15g, a 10x error that
  // looks confidently correct. A wrong number is worse than a blank one, so these
  // specific, narrow substitutions exist to stop bad data passing silently rather
  // than to "clean up" OCR text generally.
  return text
    .replace(/kca\|/gi, 'kcal')
    .replace(/\bO\.(\d)/g, '0.$1')            // "O.15" -> "0.15"
    .replace(/(\d)O(\d)/g, '$1' + '0' + '$2'); // "1O0" -> "100"
}

// Plausible per-100g ceilings for each nutrient — anything above this on a real
// UK nutrition label is almost certainly a decimal point OCR failure (e.g. "13.8"
// misread as "138") rather than a genuine value, since these are physical
// maximums for what 100g of any real food can contain. This is a safety net,
// not the primary parsing strategy — a plausible OCR number is trusted as-is.
const NUTRIENT_PLAUSIBLE_MAX = {
  kcal: 900, fat_g: 100, saturates_g: 100, carbs_g: 100,
  sugar_g: 100, fibre_g: 100, protein_g: 100, salt_g: 30
};

function sanityCheckNutrient(key, val) {
  if (val == null) return { value: null };
  const ceiling = NUTRIENT_PLAUSIBLE_MAX[key];
  if (ceiling != null && val > ceiling) {
    // Try repairing an apparently lost decimal point (e.g. 138 -> 13.8).
    // If the repaired value is still implausible, this wasn't a simple
    // decimal-loss case — reject to null rather than guess further.
    const corrected = Math.round((val / 10) * 10) / 10;
    if (corrected <= ceiling) return { value: corrected, flag: 'corrected_decimal' };
    return { value: null, flag: 'rejected_implausible' };
  }
  return { value: val };
}

function parseNutritionText(rawText) {
  // Best-effort pattern matching for a UK-style "Typical values / Per 100g" panel.
  // Anything not confidently matched stays null — never guessed.
  const text = normalizeOcrText(rawText);
  const grab = (re) => { const m = text.match(re); return m ? parseFloat(m[1]) : null; };
  const rawValues = {
    kcal: grab(/(\d+(?:\.\d+)?)\s*kcal/i),
    fat_g: grab(/\bfat[^\d\n]{0,15}(\d+(?:\.\d+)?)\s*g/i),
    saturates_g: grab(/saturat\w*[^\d\n]{0,20}(\d+(?:\.\d+)?)\s*g/i),
    carbs_g: grab(/carbohydrate[^\d\n]{0,15}(\d+(?:\.\d+)?)\s*g/i),
    sugar_g: grab(/sugars?[^\d\n]{0,20}(\d+(?:\.\d+)?)\s*g/i),
    fibre_g: grab(/fibre[^\d\n]{0,15}(\d+(?:\.\d+)?)\s*g/i),
    protein_g: grab(/protein[^\d\n]{0,15}(\d+(?:\.\d+)?)\s*g/i),
    salt_g: grab(/salt[^\d\n]{0,15}(\d+(?:\.\d+)?)\s*g/i),
  };
  const values = { rawText: text };
  const flags = {};
  Object.keys(rawValues).forEach(key => {
    const checked = sanityCheckNutrient(key, rawValues[key]);
    values[key] = checked.value;
    if (checked.flag) flags[key] = checked.flag;
  });
  values._flags = flags;
  return values;
}

function renderPackageReview(parsed, rawText) {
  const readCount = Object.entries(parsed).filter(([k,v]) => k !== 'rawText' && k !== '_flags' && v != null).length;
  const confidence = readCount >= 6 ? 'high' : readCount >= 3 ? 'medium' : 'low';
  const flags = parsed._flags || {};
  const NUTRIENT_LABELS = { kcal:'kcal', fat_g:'Fat', saturates_g:'Saturates', carbs_g:'Carbs', sugar_g:'Sugar', fibre_g:'Fibre', protein_g:'Protein', salt_g:'Salt' };
  const correctedFields = Object.keys(flags).filter(k => flags[k] === 'corrected_decimal').map(k => NUTRIENT_LABELS[k]);
  const rejectedFields = Object.keys(flags).filter(k => flags[k] === 'rejected_implausible').map(k => NUTRIENT_LABELS[k]);

  const item = {
    id: 'item_' + Date.now(),
    source: 'package_ocr',
    barcode: null,
    name: '',
    confidenceId: confidence,
    confidencePortion: 'high',
    portionEstimate: '100g reference',
    scannedAt: new Date().toISOString(),
    consumedAt: null,
    nutrients: {
      kcal: parsed.kcal, fat_g: parsed.fat_g, saturates_g: parsed.saturates_g,
      carbs_g: parsed.carbs_g, sugar_g: parsed.sugar_g, fibre_g: parsed.fibre_g,
      protein_g: parsed.protein_g, salt_g: parsed.salt_g
    },
    organic: null, gmStatus: null, ingredientsText: null, allergens: null
  };

  let warningHtml = '';
  if (correctedFields.length) {
    warningHtml += `<p style="color:var(--amber); font-size:12px; margin-top:6px;">⚠ ${correctedFields.join(', ')} looked like a misread decimal point (e.g. "138" read as "13.8") — auto-corrected, please double-check against the label.</p>`;
  }
  if (rejectedFields.length) {
    warningHtml += `<p style="color:var(--red); font-size:12px; margin-top:6px;">⚠ ${rejectedFields.join(', ')} read an implausible value and was left blank rather than guessed — enter it manually if you can read it.</p>`;
  }

  const container = document.getElementById('review-container');
  container.innerHTML = `
    <div class="review">
      <h3>Label read — check it matches</h3>
      <p style="color:var(--muted); font-size:12px;">OCR read ${readCount} of 8 values. ${confidence === 'low' ? 'Low confidence — check every field carefully or retake with better lighting.' : ''}</p>
      ${warningHtml}
    </div>` + buildReviewHtml(item, { showNameField: true, showConsumedNow: true });
  bindReviewHandlers(item);
}

function buildManualPackageForm() {
  const item = {
    id: 'item_' + Date.now(), source: 'package_manual', barcode: null, name: '',
    confidenceId: 'high', confidencePortion: 'high', portionEstimate: '100g reference',
    scannedAt: new Date().toISOString(), consumedAt: null,
    nutrients: { kcal:null, fat_g:null, saturates_g:null, carbs_g:null, sugar_g:null, fibre_g:null, protein_g:null, salt_g:null },
    organic: null, gmStatus: null, ingredientsText: null, allergens: null
  };
  window._manualItem = item;
  return buildReviewHtml(item, { showNameField: true, showConsumedNow: true });
}
function bindManualPackageHandlers() { bindReviewHandlers(window._manualItem); }

// ========================= Plate mode: vision identify via Anthropic API =========================
async function runVisionIdentify(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  const mediaType = dataUrl.match(/data:(image\/\w+);/)[1];

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: `Identify the food item(s) in this photo. Respond ONLY with JSON, no other text, no markdown fences:
{"items":[{"name":"food name","confidence":"high|medium|low","portionEstimate":"e.g. approx 150g or 1 medium bowl","portionConfidence":"high|medium|low"}],"notes":"any relevant caveat about lighting, angle, or uncertainty, or empty string"}
If multiple distinct foods are visible (e.g. a full plate), list each as a separate item. Be honest about low confidence rather than guessing precisely — this feeds a personal health log where honest gaps matter more than false precision.` }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = data.content.find(b => b.type === 'text');
    const clean = textBlock.text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    renderPlateReview(parsed);
  } catch (e) {
    document.getElementById('review-container').innerHTML = `
      <div class="review"><h3>Identification failed</h3>
      <p style="color:var(--muted); font-size:13px;">Could not identify the food from this photo. Retake with better lighting, or describe it manually below.</p>
      </div>` + buildManualPlateForm();
    bindManualPackageHandlers();
  }
}

function renderPlateReview(parsed) {
  const container = document.getElementById('review-container');
  const notesHtml = parsed.notes ? `<p style="color:var(--muted); font-size:12px; margin-top:6px;">${escapeHtml(parsed.notes)}</p>` : '';

  container.innerHTML = `<div class="review"><h3>${parsed.items.length > 1 ? parsed.items.length + ' items identified' : 'Item identified'}</h3>${notesHtml}</div>`;

  parsed.items.forEach((food, idx) => {
    const item = {
      id: 'item_' + Date.now() + '_' + idx,
      source: 'plate_vision',
      barcode: null,
      name: food.name,
      confidenceId: food.confidence,
      confidencePortion: food.portionConfidence,
      portionEstimate: food.portionEstimate,
      scannedAt: new Date().toISOString(),
      consumedAt: window._lastPhotoTimestamp || new Date().toISOString(),
      nutrients: { kcal:null, fat_g:null, saturates_g:null, carbs_g:null, sugar_g:null, fibre_g:null, protein_g:null, salt_g:null },
      organic: null, gmStatus: null, ingredientsText: null, allergens: null,
      needsNutrientLookup: true
    };
    const div = document.createElement('div');
    div.innerHTML = buildReviewHtml(item, { showNameField: true, showConsumedField: true, editableName: true });
    container.appendChild(div.firstElementChild);
    bindReviewHandlers(item);
  });
}

function buildManualPlateForm() {
  const item = {
    id: 'item_' + Date.now(), source: 'plate_manual', barcode: null, name: '',
    confidenceId: 'low', confidencePortion: 'low', portionEstimate: '',
    scannedAt: new Date().toISOString(), consumedAt: new Date().toISOString(),
    nutrients: { kcal:null, fat_g:null, saturates_g:null, carbs_g:null, sugar_g:null, fibre_g:null, protein_g:null, salt_g:null },
    organic: null, gmStatus: null, ingredientsText: null, allergens: null
  };
  window._manualItem = item;
  return buildReviewHtml(item, { showNameField: true, showConsumedField: true, editableName: true });
}

// ========================= Shared review card builder =========================
function confPill(level) {
  if (!level) return '';
  const cls = level === 'high' ? 'conf-high' : level === 'medium' ? 'conf-medium' : 'conf-low';
  return `<span class="conf-pill ${cls}">${level} confidence</span>`;
}

function buildReviewHtml(item, opts = {}) {
  opts = Object.assign({ showNameField: false, showConsumedNow: false, showConsumedField: false, editableName: false }, opts);
  const nutrientFields = [
    ['kcal','kcal',''], ['protein_g','Protein','g'], ['fat_g','Fat','g'], ['saturates_g','Saturates','g'],
    ['carbs_g','Carbs','g'], ['sugar_g','Sugar','g'], ['fibre_g','Fibre','g'], ['salt_g','Salt','g']
  ];
  const nutrientHtml = nutrientFields.map(([key,label,unit]) => `
    <div class="field">
      <label>${label}${unit ? ' ('+unit+')' : ''}</label>
      <input type="number" step="0.1" data-nutrient="${key}" value="${item.nutrients[key] ?? ''}" placeholder="—">
    </div>`).join('');

  const certHtml = (item.organic || item.gmStatus) ? `
    <div class="cert-row">
      ${item.organic ? `<span class="cert-pill known">${item.organic}</span>` : ''}
      ${item.gmStatus ? `<span class="cert-pill known">${item.gmStatus}</span>` : ''}
    </div>` : `<p class="blank-note">No organic/GM data submitted for this product — left blank, not assumed.</p>`;

  const nameHtml = opts.showNameField ? `
    <div class="field">
      <label>Item</label>
      <input type="text" data-field="name" value="${escapeHtml(item.name)}" placeholder="e.g. product or food name" ${opts.editableName ? '' : ''}>
    </div>` : `<h3 style="margin-bottom:2px;">${escapeHtml(item.name)}</h3>`;

  const portionHtml = item.portionEstimate ? `
    <div class="field">
      <label>Portion (estimated)</label>
      <input type="text" data-field="portionEstimate" value="${escapeHtml(item.portionEstimate)}">
    </div>` : '';

  let consumedHtml = '';
  if (opts.showConsumedNow) {
    consumedHtml = `
      <div class="field">
        <label>Consumed at</label>
        <select data-field="consumedMode">
          <option value="now">Now (default)</option>
          <option value="stock">Not eaten yet — shopping / stock</option>
          <option value="custom">Different time…</option>
        </select>
      </div>
      <div class="field" data-consumed-custom style="display:none;">
        <input type="datetime-local" data-field="consumedCustom">
      </div>`;
  } else if (opts.showConsumedField) {
    const tsDefault = item.consumedAt ? item.consumedAt.slice(0,16) : '';
    const fromPhoto = window._lastPhotoTimestamp ? ' <span style="color:var(--green);">· from photo</span>' : '';
    consumedHtml = `
      <div class="field">
        <label>Consumed at${fromPhoto}</label>
        <input type="datetime-local" data-field="consumedCustom" value="${tsDefault}">
      </div>`;
  }

  return `
    <div class="review" data-item-id="${item.id}">
      ${nameHtml}
      <div class="conf-row">${confPill(item.confidenceId)}${item.confidencePortion ? confPill(item.confidencePortion) + ' portion' : ''}</div>
      ${portionHtml}
      ${consumedHtml}
      <div class="divider"></div>
      <div class="nutrient-grid">${nutrientHtml}</div>
      <p class="blank-note">Blank fields mean not confidently read — never guessed. Fill in manually if you know them.</p>
      ${certHtml}
      ${item.ingredientsText ? `<div class="field"><label>Ingredients</label><textarea readonly>${escapeHtml(item.ingredientsText)}</textarea></div>` : ''}
      ${item.allergens ? `<p class="blank-note">Allergens: ${escapeHtml(item.allergens)}</p>` : ''}
      <button class="btn btn-primary" style="width:100%; margin-top:14px;" onclick="confirmItem('${item.id}')">Add to queue</button>
    </div>`;
}

function bindReviewHandlers(item) {
  const card = document.querySelector(`[data-item-id="${item.id}"]`);
  if (!card) return;
  window['_pending_' + item.id] = item;

  card.querySelectorAll('[data-nutrient]').forEach(input => {
    input.addEventListener('input', () => {
      const v = input.value === '' ? null : parseFloat(input.value);
      item.nutrients[input.dataset.nutrient] = v;
    });
  });
  const nameInput = card.querySelector('[data-field="name"]');
  if (nameInput) nameInput.addEventListener('input', () => item.name = nameInput.value);
  const portionInput = card.querySelector('[data-field="portionEstimate"]');
  if (portionInput) portionInput.addEventListener('input', () => item.portionEstimate = portionInput.value);

  const consumedMode = card.querySelector('[data-field="consumedMode"]');
  const customField = card.querySelector('[data-consumed-custom]');
  if (consumedMode) {
    consumedMode.addEventListener('change', () => {
      customField.style.display = consumedMode.value === 'custom' ? 'block' : 'none';
      if (consumedMode.value === 'now') item.consumedAt = new Date().toISOString();
      else if (consumedMode.value === 'stock') item.consumedAt = null;
    });
    item.consumedAt = new Date().toISOString(); // default
  }
  const customInput = card.querySelector('[data-field="consumedCustom"]');
  if (customInput) customInput.addEventListener('input', () => { item.consumedAt = new Date(customInput.value).toISOString(); });
}

function confirmItem(id) {
  const item = window['_pending_' + id];
  if (!item) return;
  if (!item.name || !item.name.trim()) { showToast('Give this item a name before adding.'); return; }
  queue.push(item);
  localStorage.setItem('foodScannerQueue', JSON.stringify(queue));
  updateQueueBar();
  showToast('Added to queue — ' + item.name);
  document.getElementById('review-container').innerHTML = '';
  retake();
}

function renderLoadingReview(msg) {
  document.getElementById('review-container').innerHTML = `<div class="review" style="text-align:center; color:var(--muted); font-size:13px;">${msg}</div>`;
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ========================= Queue / export =========================
function updateQueueBar() {
  const bar = document.getElementById('queue-bar');
  document.getElementById('queue-count').textContent = queue.length;
  bar.style.display = queue.length > 0 ? 'flex' : 'none';
}

function goToQueue() {
  window.location.href = 'queue.html';
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
</script>
